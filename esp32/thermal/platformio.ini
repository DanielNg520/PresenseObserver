[env:adafruit_feather_esp32s3]
platform = espressif32
board = esp32s3devkitc1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.psram_type = opi
upload_speed = 921600
extra_scripts = pre:pre_extra_script.py
build_flags =
    ; Enable the optional INMP441 I2S microphone. Comment out to build without
    ; the mic; the firmware runs identically, just without a sound level.
    -D USE_MIC
lib_deps =
    knolleary/PubSubClient
    adafruit/Adafruit AMG88xx Library
    tanakamasayuki/TensorFlowLite_ESP32
    tzapu/WiFiManager
