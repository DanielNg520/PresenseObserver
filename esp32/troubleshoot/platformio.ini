[env:esp32s3_wroom_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3-WROOM-1 N16R8: 16MB QSPI flash + 8MB Octal PSRAM
; memory_type qio_opi selects the QIO-flash + OPI-PSRAM Arduino variant
; (required for Octal PSRAM, otherwise PSRAM init fails with a line-mode error)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; CDC_ON_BOOT=1 -> Serial goes to the native USB port (/dev/cu.usbmodem*).
    ; Set to 0 if you monitor via a separate CP210x/CH340 "UART" port.
    -DARDUINO_USB_CDC_ON_BOOT=1
